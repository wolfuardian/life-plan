<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>一步一步：結婚到定居</title><style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#2b2b2b;--mute:#6b6b6b;--me:#2f6f5e;--pt:#9a4f2f;--both:#44507a;--warn:#b7791f;--line:#e6e1d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 60px}
header h1{font-size:1.6rem;margin:0 0 4px}
header p{margin:0;color:var(--mute);font-size:.92rem}
.key{background:var(--card);border-left:5px solid var(--both);border-radius:10px;padding:14px 18px;margin:20px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;flex-wrap:wrap}
.tabs a{text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.9rem;color:#fff}
.t-me{background:var(--me)}.t-pt{background:var(--pt)}.t-both{background:var(--both)}.t-warn{background:var(--warn)}.t-next{background:#555}
section{background:var(--card);border-radius:12px;padding:18px 20px;margin:18px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:5px solid var(--c)}
section h2{margin:0 0 10px;font-size:1.25rem;color:var(--c)}
.me{--c:var(--me)}.pt{--c:var(--pt)}.both{--c:var(--both)}.warn{--c:var(--warn)}.next{--c:#555}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{border-bottom:1px solid var(--line);padding:10px 0}
ul.check li:last-child{border:none}
ul.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.check input{margin-top:6px;width:18px;height:18px;accent-color:var(--c);flex:none}
.detail{display:block;color:var(--mute);font-size:.9rem;margin-top:2px}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:6px;background:#fbeed3;color:#8a5a00;margin-left:6px}
.progress{font-size:.85rem;color:var(--mute);margin:-4px 0 8px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:.88rem}
.src a{color:var(--both);word-break:break-all;font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
footer{color:var(--mute);font-size:.8rem;margin-top:30px}
@media print{.tabs{display:none}section{box-shadow:none;break-inside:avoid}}
.back{position:fixed;right:14px;bottom:18px;z-index:10;background:#44507a;color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:.95rem;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-family:inherit}@media print{.back{display:none}}.who{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:6px;color:#fff;margin-right:6px;vertical-align:1px}.w-me{background:#2f6f5e}.w-pt{background:#9a4f2f}.w-both{background:#44507a}.num{color:#999;font-size:.85rem;margin-right:4px}.when{display:block;font-size:.85rem;color:#8a5a00;margin-top:2px}</style></head><body><div class="wrap">
<button class="back" onclick="if(history.length>1&&document.referrer.indexOf(location.host)>-1){history.back()}else{location.href='./'}">← 上一頁</button>
<p><a href="./" style="color:#44507a;font-size:.9rem">← 回首頁</a></p>
<header><h1>一步一步：從結婚到定居</h1><p>照時間順序排好，做完一步勾一步｜<span class="who w-me">我</span><span class="who w-pt">伴侶</span><span class="who w-both">一起</span>｜查證日期 2026-09-25</p></header>
<div class="key">詳細文件說明和官方來源，請看<a href="marriage-docs.html">結婚文件清單</a>和<a href="residence.html">依親居留</a>兩頁。實際要求以辦理機關當下的規定為準。</div>
<section class="both"><h2>階段一：伴侶在香港時的準備</h2><div class="progress" data-for="p1"></div><ul class="check" data-group="p1"><li><label><input type="checkbox"><span>選定結婚登記日期和要去的戶政事務所<span class="detail" style="margin-top:4px"><span class="num">第 1 步</span><span class="who w-both">一起</span></span><span class="when">⏱ 當天就能完成</span><span class="detail">打電話給那間戶政所，確認港澳居民結婚要帶的文件（各所可能有小差異）。</span></span></label></li><li><label><input type="checkbox"><span>打電話問移民署服務站：良民證會寄到香港的辦事處，在台灣送依親居留時要怎麼附<span class="detail" style="margin-top:4px"><span class="num">第 2 步</span><span class="who w-both">一起</span></span><span class="when">⏱ 當天就能完成</span><span class="detail">這一點官方沒有寫清楚，先問好，後面才不會卡住。</span></span></label></li><li><label><input type="checkbox"><span>線上申請入出境許可證（不要用網簽）<span class="detail" style="margin-top:4px"><span class="num">第 3 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 審核約 5 個工作天，辦事處建議預留 1～2 個月</span><span class="detail">境外人士線上申辦系統，單次 NT$600，有效 6 個月。用網簽入境的人不能在台灣申請居留。</span></span></label></li><li><label><input type="checkbox"><span>入出境許可證核准後，30 天內線上繳費<span class="detail" style="margin-top:4px"><span class="num">第 4 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 核准後 30 天內</span><span class="detail">超過 30 天沒繳要重新申請。</span></span></label></li><li><label><input type="checkbox"><span>向香港入境處申請「無結婚紀錄證明書」<span class="detail" style="margin-top:4px"><span class="num">第 5 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 約 7 個工作天</span><span class="detail">表格 MR35，可親自、郵寄或網上申請。查紀錄時付 HK$140，領證明時付 HK$680。曾經離婚的改辦結婚紀錄證明加絕對判令證明書。從發出日起 6 個月內要完成結婚登記。</span></span></label></li><li><label><input type="checkbox"><span>親自到台北經濟文化辦事處（香港），辦兩件事：驗證單身證明、領良民證推薦函<span class="detail" style="margin-top:4px"><span class="num">第 6 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 驗證普通件 2 個工作天，速件 1 個工作天</span><span class="detail">灣仔港灣道 18 號中環廣場 49 樓 4907 室，週一到週五 9:00–12:30 收件。驗證普通件 HK$120、速件 HK$180，只收現金。領推薦函要帶香港身分證。</span></span></label></li><li><label><input type="checkbox"><span>確定來台日期後，拿推薦函向香港警務處申請良民證<span class="detail" style="margin-top:4px"><span class="num">第 7 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 網上約 15 天，親自遞交最多 28 天</span><span class="detail">良民證只有 3 個月效期，所以等來台日期確定了才申請。網上申請約 15 天，2026-10-12 起費用 HK$340。證明書會直接寄給辦事處，本人拿不到；收據要留好。</span></span></label></li><li><label><input type="checkbox"><span>訂來台機票<span class="detail" style="margin-top:4px"><span class="num">第 8 步</span><span class="who w-pt">伴侶</span></span><span class="detail">入境時用入出境許可證。安排停留時間時，要留足結婚登記、健檢、送件和等待審查的時間（可停留 3 個月，能再延 3 個月）。</span></span></label></li><li><label><input type="checkbox"><span>準備結婚書約，找好 2 位成年證人<span class="detail" style="margin-top:4px"><span class="num">第 9 步</span><span class="who w-me">我</span></span><span class="detail">書約可在戶政所網站下載。證人要真的知道你們要結婚。</span></span></label></li><li><label><input type="checkbox"><span>下載並親自簽好「港澳居民專用保證書」<span class="detail" style="margin-top:4px"><span class="num">第 10 步</span><span class="who w-me">我</span></span><span class="detail">移民署網站下載。</span></span></label></li><li><label><input type="checkbox"><span>下載並填好居留要用的表格<span class="detail" style="margin-top:4px"><span class="num">第 11 步</span><span class="who w-pt">伴侶</span></span><span class="detail">入境居留申請書、香港或澳門居民身分確認書（本人簽名）、居留定居申報書（第 7 版）。另外準備 1 張身分證規格彩色照片。</span></span></label></li></ul></section>
<section class="pt"><h2>階段二：伴侶來台、結婚登記</h2><div class="progress" data-for="p2"></div><ul class="check" data-group="p2"><li><label><input type="checkbox"><span>持入出境許可證入境台灣<span class="detail" style="margin-top:4px"><span class="num">第 12 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 入境當天</span><span class="detail">入境後可停留 3 個月，可延期 1 次 3 個月。</span></span></label></li><li><label><input type="checkbox"><span>一起到戶政事務所辦結婚登記<span class="detail" style="margin-top:4px"><span class="num">第 13 步</span><span class="who w-both">一起</span></span><span class="when">⏱ 約半天</span><span class="detail">帶齊：你的身分證、戶口名簿、印章、身分證規格照片；伴侶的護照、香港身分證、驗證過的單身證明；結婚書約。規費是換身分證 NT$50、換戶口名簿 NT$30。</span></span></label></li><li><label><input type="checkbox"><span>在戶政所順便申請：登記了配偶資料的戶籍謄本，以及結婚證明書<span class="detail" style="margin-top:4px"><span class="num">第 14 步</span><span class="who w-me">我</span></span><span class="when">⏱ 當場拿到</span><span class="detail">戶籍謄本送居留件時要用。結婚證明書每份 NT$100，建議中英文各一份。</span></span></label></li></ul></section>
<section class="both"><h2>階段三：申請依親居留</h2><div class="progress" data-for="p3"></div><ul class="check" data-group="p3"><li><label><input type="checkbox"><span>到疾管署指定醫院做居留健康檢查<span class="detail" style="margin-top:4px"><span class="num">第 15 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 報告通常要幾個工作天</span><span class="detail">項目有胸部 X 光、梅毒血清檢查、麻疹與德國麻疹抗體（或預防接種證明）。報告 3 個月內有效。</span></span></label></li><li><label><input type="checkbox"><span>一起到移民署服務站送依親居留<span class="detail" style="margin-top:4px"><span class="num">第 16 步</span><span class="who w-both">一起</span></span><span class="when">⏱ 審查約 5 個工作天，良民證轉寄時間另計</span><span class="detail">伴侶帶：申請書和照片、護照、香港身分證、入出境許可證、健檢報告、身分確認書、申報書、良民證收據。你帶：保證書、身分證正本和影本、戶籍謄本。在台申請居留證 NT$1,000。</span></span></label></li><li><label><input type="checkbox"><span>領居留證，決定要不要加辦居留入出境證<span class="detail" style="margin-top:4px"><span class="num">第 17 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 核准後</span><span class="detail">只有居留證的話，每次出入境前都要先申請許可；加辦居留入出境證（NT$2,600）就能直接出入境。</span></span></label></li></ul></section>
<section class="me"><h2>階段四：拿到居留之後</h2><div class="progress" data-for="p4"></div><ul class="check" data-group="p4"><li><label><input type="checkbox"><span>需要的話開始工作<span class="detail" style="margin-top:4px"><span class="num">第 18 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 拿到居留證就可以</span><span class="detail">不用申請工作許可。伴侶自己受僱的話，從上班那天起就能加健保。</span></span></label></li><li><label><input type="checkbox"><span>居留滿 6 個月：加入健保（依附你投保）<span class="detail" style="margin-top:4px"><span class="num">第 19 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 居留滿 6 個月</span><span class="detail">沒有受僱的話，要在台灣連續住滿 6 個月才能加保。</span></span></label></li><li><label><input type="checkbox"><span>居留滿 6 個月：香港駕照換發台灣駕照<span class="detail" style="margin-top:4px"><span class="num">第 20 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 居留滿 6 個月</span><span class="detail">免考，要先體檢，香港駕照要經辦事處驗證。</span></span></label></li><li><label><input type="checkbox"><span>居留證快到期時辦延期<span class="detail" style="margin-top:4px"><span class="num">第 21 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 到期當月</span><span class="detail">只能在到期前 30 天內送件。逾期會讓定居時程延後 1 年，一定要記得。</span></span></label></li></ul></section>
<section class="pt"><h2>階段五：申請定居、拿身分證</h2><div class="progress" data-for="p5"></div><ul class="check" data-group="p5"><li><label><input type="checkbox"><span>符合條件時申請定居<span class="detail" style="margin-top:4px"><span class="num">第 22 步</span><span class="who w-both">一起</span></span><span class="when">⏱ 審查約 5 個工作天</span><span class="detail">條件是婚姻滿 3 年（婚後已生子女的不用等滿 3 年），再加上：連續住滿 1 年且這一年出境不超過 30 天，或連續住滿 2 年且每年住滿 270 天。證件費 NT$600。</span></span></label></li><li><label><input type="checkbox"><span>領到定居證後 30 天內，到戶政所辦戶籍登記、申請身分證<span class="detail" style="margin-top:4px"><span class="num">第 23 步</span><span class="who w-pt">伴侶</span></span><span class="when">⏱ 定居證核發後 30 天內</span><span class="detail">現行規定不用放棄香港身分。</span></span></label></li><li><label><input type="checkbox"><span>第一次出國前，申請中華民國護照<span class="detail" style="margin-top:4px"><span class="num">第 24 步</span><span class="who w-pt">伴侶</span></span><span class="detail">設籍後要用台灣人民身分出入境。</span></span></label></li></ul></section>

<footer>本頁整理自官方公開資料。勾選狀態會自動保存。</footer>
</div><script src="sync.js"></script></body></html>
