<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>長住規劃｜完整步驟</title>
<style>
:root{--bg:#f7f5f0;--ink:#2b2b2b;--mute:#6b6b6b;--me:#2f6f5e;--pt:#9a4f2f;--both:#44507a;--line:#ece7de}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px 12px 70px}
header h1{font-size:1.3rem;margin:0}header p{margin:2px 0 0;color:var(--mute);font-size:.82rem}
.top{font-size:.85rem;margin-bottom:8px}.top a{color:var(--both)}
.legend{font-size:.8rem;color:var(--mute);margin:8px 0}
ul.check{list-style:none;padding:0;margin:0;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
ul.check li{border-bottom:1px solid var(--line);padding:7px 10px}
ul.check li.ph{background:#efeae1;font-weight:700;font-size:.85rem;color:#555;padding:5px 10px}
ul.check li.ph:first-child{border-radius:10px 10px 0 0}
label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--both)}
.step{flex:none;min-width:1.6em;color:var(--mute);font-size:.82rem;margin-top:2px;text-align:right}
.who{flex:none;font-size:.72rem;color:#fff;border-radius:5px;padding:1px 6px;margin-top:2px}
.who.me{background:var(--me)}.who.pt{background:var(--pt)}.who.both{background:var(--both)}
.tx{font-size:.93rem}
input:checked~.tx{color:#aaa;text-decoration:line-through}
.detail{display:block;color:var(--mute);font-size:.78rem}
.tag{font-size:.68rem;padding:0 6px;border-radius:5px;background:#fbeed3;color:#8a5a00;margin-left:5px}
.progress{font-size:.8rem;color:var(--mute);margin:4px 0}
footer{color:var(--mute);font-size:.75rem;margin-top:16px}footer a{color:var(--both)}
.back{position:fixed;right:14px;bottom:14px;background:var(--both);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:.9rem;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
</style></head><body><div class="wrap">
<div class="top"><a href="index.html">← 回首頁</a></div>
<header><h1>結婚、居留、定居：完整步驟</h1><p>照先後順序由上往下做。港澳居民配偶規定，2026-09-25 查證。</p></header>
<div class="legend"><span class="who me">我</span> 臺灣方　<span class="who pt">伴侶</span> 香港方　<span class="who both">一起</span> 兩人一起</div>
<div class="progress" data-for="all"></div>
<ul class="check" data-group="all">
<li class="ph">結婚前準備</li>
<li><label><input type="checkbox"><span class="step">1</span><span class="who both">一起</span><span class="tx">選定登記日期和戶政事務所，打電話確認文件<span class="detail">全國任一戶政所都能辦，各所細節可能不同。可在結婚日前 3 個辦公日內先辦並指定生效日</span></span></label></li>
<li><label><input type="checkbox"><span class="step">2</span><span class="who pt">伴侶</span><span class="tx">線上申請入出境許可證（不要用網簽）<span class="detail">單次 NT$600，有效 6 個月，審核約 5 個工作天，建議預留 1～2 個月；核准後 30 天內線上繳費。用網簽入境不能在台申請居留</span></span></label></li>
<li><label><input type="checkbox"><span class="step">3</span><span class="who pt">伴侶</span><span class="tx">向香港入境處申請「無結婚紀錄證明書」（MR35）<span class="detail">約 7 個工作天，HK$140＋HK$680。發出後 6 個月內要完成結婚登記。離過婚的改辦結婚紀錄證明＋絕對判令證明書</span></span></label></li>
<li><label><input type="checkbox"><span class="step">4</span><span class="who pt">伴侶</span><span class="tx">證明書親自送台北經濟文化辦事處（香港）驗證<span class="detail">灣仔港灣道 18 號中環廣場 49 樓 4907 室。平日 9:00–12:30 收件、14:00–17:00 領件。普通件 HK$120（2 天）、速件 HK$180（1 天），只收現金</span></span></label></li>
<li><label><input type="checkbox"><span class="step">5</span><span class="who pt">伴侶</span><span class="tx">同一趟在辦事處領良民證推薦函<span class="detail">帶香港身分證。之後申請良民證要用</span></span></label></li>
<li><label><input type="checkbox"><span class="step">6</span><span class="who both">一起</span><span class="tx">打電話問移民署服務站：良民證寄到辦事處後，在台送件要怎麼附<span class="detail">順便確認去哪個服務站、要不要預約</span></span></label></li>
<li><label><input type="checkbox"><span class="step">7</span><span class="who pt">伴侶</span><span class="tx">證明書的中文譯本＋台灣公證人認證<span class="tag">視情況</span><span class="detail">證明書只有英文時才需要</span></span></label></li>
<li><label><input type="checkbox"><span class="step">8</span><span class="who pt">伴侶</span><span class="tx">外籍配偶取用中文姓名聲明書<span class="tag">視情況</span><span class="detail">護照上已有中文姓名通常不用，以戶政所認定為準</span></span></label></li>
<li><label><input type="checkbox"><span class="step">9</span><span class="who me">我</span><span class="tx">準備結婚書約<span class="detail">戶政所網站下載或現場拿。伴侶地址填香港地址</span></span></label></li>
<li><label><input type="checkbox"><span class="step">10</span><span class="who both">一起</span><span class="tx">請 2 位證人在結婚書約上簽名<span class="detail">成年，且真的知道你們要結婚</span></span></label></li>
<li><label><input type="checkbox"><span class="step">11</span><span class="who me">我</span><span class="tx">準備身分證規格彩色照片 1 張<span class="detail">2 年內拍的，用來換發新身分證</span></span></label></li>
<li><label><input type="checkbox"><span class="step">12</span><span class="who pt">伴侶</span><span class="tx">來台日期確定後，拿推薦函申請香港良民證<span class="detail">只有 3 個月效期。網上申請約 15 天，2026-10-12 起 HK$340。證明書直接寄給辦事處，收據要留好</span></span></label></li>
<li><label><input type="checkbox"><span class="step">13</span><span class="who me">我</span><span class="tx">下載並親自簽好「港澳居民專用保證書」<span class="detail">移民署網站下載</span></span></label></li>
<li><label><input type="checkbox"><span class="step">14</span><span class="who pt">伴侶</span><span class="tx">填好居留表格，準備 1 張身分證規格照片<span class="detail">入境居留申請書、港澳居民身分確認書（本人簽名）、居留定居申報書（第 7 版）</span></span></label></li>
<li><label><input type="checkbox"><span class="step">15</span><span class="who pt">伴侶</span><span class="tx">書面說明書<span class="tag">視情況</span><span class="detail">申報書中有任職情形才要附</span></span></label></li>
<li><label><input type="checkbox"><span class="step">16</span><span class="who pt">伴侶</span><span class="tx">持入出境許可證入境台灣<span class="detail">可停留 3 個月，可延期 1 次</span></span></label></li>
<li class="ph">結婚登記</li>
<li><label><input type="checkbox"><span class="step">17</span><span class="who me">我</span><span class="tx">帶齊：身分證正本、戶口名簿、印章、照片、書約、規費<span class="detail">換身分證 NT$50、戶口名簿 NT$30、結婚證明書每份 NT$100</span></span></label></li>
<li><label><input type="checkbox"><span class="step">18</span><span class="who pt">伴侶</span><span class="tx">帶齊：香港特區護照、香港永久性居民身分證、驗證過的證明書（和譯本）</span></label></li>
<li><label><input type="checkbox"><span class="step">19</span><span class="who both">一起</span><span class="tx">一起親自到戶政所辦結婚登記<span class="detail">個案仍可能被約談或查證</span></span></label></li>
<li><label><input type="checkbox"><span class="step">20</span><span class="who me">我</span><span class="tx">當場申請登記了配偶資料的戶籍謄本<span class="detail">依親居留要用</span></span></label></li>
<li class="ph">依親居留</li>
<li><label><input type="checkbox"><span class="step">21</span><span class="who pt">伴侶</span><span class="tx">到疾管署指定醫院做居留健康檢查<span class="detail">胸部 X 光、梅毒血清、麻疹與德國麻疹抗體。報告 3 個月內有效</span></span></label></li>
<li><label><input type="checkbox"><span class="step">22</span><span class="who me">我</span><span class="tx">送件要帶：身分證正本＋影本、保證書、戶籍謄本</span></label></li>
<li><label><input type="checkbox"><span class="step">23</span><span class="who pt">伴侶</span><span class="tx">送件要帶：護照＋香港身分證（正本＋影本）、入出境許可證、健檢報告、良民證收據、表格和照片<span class="detail">請別人代送要加委託書</span></span></label></li>
<li><label><input type="checkbox"><span class="step">24</span><span class="who both">一起</span><span class="tx">到移民署服務站送依親居留申請<span class="detail">居留證 NT$1,000，審查約 5 個工作天，良民證轉寄時間另計</span></span></label></li>
<li><label><input type="checkbox"><span class="step">25</span><span class="who pt">伴侶</span><span class="tx">領居留證，決定要不要加辦居留入出境證<span class="detail">加辦（NT$2,600）才能直接出入境，否則每次都要先申請</span></span></label></li>
<li class="ph">拿到居留後</li>
<li><label><input type="checkbox"><span class="step">26</span><span class="who pt">伴侶</span><span class="tx">可以直接工作，不用工作許可<span class="detail">需要證照的工作仍要符合各行業規定</span></span></label></li>
<li><label><input type="checkbox"><span class="step">27</span><span class="who both">一起</span><span class="tx">加入健保<span class="detail">伴侶受僱就從上班日加保；沒受僱要在台連續住滿 6 個月，再依附我投保</span></span></label></li>
<li><label><input type="checkbox"><span class="step">28</span><span class="who pt">伴侶</span><span class="tx">居留滿 6 個月後，換發台灣駕照<span class="tag">視情況</span><span class="detail">免考，要體檢，香港駕照要經辦事處驗證</span></span></label></li>
<li><label><input type="checkbox"><span class="step">29</span><span class="who pt">伴侶</span><span class="tx">居留證到期前 30 天內辦延期<span class="detail">逾期會影響定居的居留期間計算</span></span></label></li>
<li class="ph">定居</li>
<li><label><input type="checkbox"><span class="step">30</span><span class="who both">一起</span><span class="tx">確認條件：婚姻滿 3 年，並符合居住天數<span class="detail">連續住滿 1 年且出境不超過 30 天；或連續 2 年、每年住滿 270 天。婚後已生子女不用等 3 年。陸委會規劃中的新制可能拉長時間</span></span></label></li>
<li><label><input type="checkbox"><span class="step">31</span><span class="who pt">伴侶</span><span class="tx">向移民署申請定居</span></label></li>
<li><label><input type="checkbox"><span class="step">32</span><span class="who pt">伴侶</span><span class="tx">核准後 30 天內到戶政所辦戶籍登記、申請身分證<span class="detail">不用放棄香港身分</span></span></label></li>
</ul>
<footer>來源：<a href="https://www.immigration.gov.tw/">移民署</a>、<a href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0030002">香港澳門居民進入臺灣地區及居留定居許可辦法</a>、<a href="https://www.roc-taiwan.org/hk/">台北經濟文化辦事處（香港）</a>、<a href="https://www.police.gov.hk/">香港警務處</a>、<a href="https://www.immd.gov.hk/">香港入境處</a>。實際以各機關當時規定為準。</footer>

<script src="sync.js"></script></body></html>
